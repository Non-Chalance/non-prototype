<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Re-Ward Prototype</title>

<style>
body{
    font-family: Arial, Helvetica, sans-serif;
    background:#fff;
    color:#000;
    margin:0;
    padding:20px;
}

.container{
    max-width:900px;
    margin:0 auto;
}

h1{
    font-size:2rem;
}

.question{
    font-size:1.6rem;
    margin-bottom:25px;
}

.answer{
    display:block;
    border:1px solid #000;
    padding:18px;
    margin-bottom:15px;
    cursor:pointer;
    font-size:1.2rem;
}

.answer:hover{
    background:#f3f3f3;
}

.radio{
    transform:scale(1.8);
    margin-right:12px;
}

.button-row{
    margin-top:20px;
}

button{
    font-size:1.1rem;
    padding:10px 20px;
    margin-right:10px;
}

.progress{
    margin-bottom:20px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<div id="app"></div>

</div>

<script>

const questions = [
{
const questions = [
{
q:"When nobody notices what you've done, are you more likely to...",
a:[
"Check it again",
"Carry on",
"Move to something else",
"Wish someone had noticed"
]
},
{
q:"Just before reaching a destination, are you usually...",
a:[
"Excited",
"Curious",
"Distracted",
"Nervous"
]
},
{
q:"When your favourite film ends, you're most likely thinking about...",
a:[
"What surprised you",
"What it meant",
"The people in it",
"How or who made it"
]
},
{
q:"When something keeps reappearing in your life, do you tend to...",
a:[
"Welcome it",
"Investigate it",
"Avoid it",
"You don't usually notice such things"
]
},
{
q:"If something remains lost after you looked in the usual places, are you more likely to...",
a:[
"Keep searching for it",
"Think about when you last saw it",
"Delay looking for it in case it is gone",
"Shrug and think it will turn up at some point"
]
},
{
q:"A conversation you had stays with you for weeks because...",
a:[
"It revealed something interesting",
"It changed something you thought was true",
"It connected something to something you had not considered before",
"It explained something you had been curious about"
]
},
{
q:"After hearing an explanation, are you more likely to...",
a:[
"Accept it and adopt it",
"Question it and then verify it through your own research",
"Test it by clarifying it at the time",
"Move on because you already knew and did not want to interrupt"
]
},
{
q:"When do you feel most satisfied?",
a:[
"Uncovering the truth",
"Building something new",
"Sharing insight with others",
"Understanding how it works"
]
},
{
q:"When you finish a first draft, do you usually...",
a:[
"Submit it right away",
"Improve it by proofreading and refining",
"Start again because the first draft is always poor",
"Leave it alone for a while to reflect before proceeding"
]
},
{
q:"Which catches your attention most?",
a:[
"Something unusual or out of place",
"Something that is obviously unfinished",
"Something overlooked by others that only you discovered",
"Something that just does not sit right for an intangible reason"
]
},
{
q:"Thinking about a memorable experience such as a family picnic or holiday, what stands out most?",
a:[
"What happened during the event",
"What changed after the event",
"Who was there or who did not show up",
"What you understood afterwards that was not known before"
]
},
{
q:"Which of these statements reflects you most?",
a:[
"There is always more to discover",
"Things become meaningful when they are created",
"Things become meaningful when they are shared",
"Things become meaningful when they are understood"
]
},
{
q:"Which of these is easiest to remember?",
a:[
"Something you discovered yourself",
"Something somebody told you",
"Something you experienced with others",
"Something you almost understood and then researched yourself"
]
},
{
q:"Which of these are you most comfortable with?",
a:[
"Not knowing the answer",
"Trying something that may not work",
"Being alone with your thoughts",
"Being misunderstood after explaining more than once"
]
},
{
q:"Which of these bothers you most?",
a:[
"Something unfinished",
"Something unexplained",
"Something unfair",
"Something forgotten"
]
}
];
const session = {
participant_code:"",
opt_in:false,
started:null,
ended:null,
completed:false,
questions:[]
};

let currentQuestion = -1;
let questionStart = 0;

const app = document.getElementById("app");

function showIntro(){

app.innerHTML = `
<h1>Re-Ward Prototype</h1>

<p>
Thank you for participating in this experiment. The contribution of your answers and your time is invaluable to me.
</p>

<p>
Your responses will contribute to determining whether this concept is viable.
</p>

<p>
If you'd like to see where it leads, you can opt in at any time.
</p>

<p>
I am available through a variety of communication methods and welcome any questions, thoughts, observations, criticisms, concerns, or a belated opt-in 😉
</p>

<p>
Ex-O-Ex-O,<br><br>
Not Gossip Girl
</p>

<hr>

<label>
Participant Code:
<select id="participant">
<option>P11</option>
<option>P21</option>
<option>P31</option>
</select>
</label>

<br><br>

<label>
<input type="checkbox" id="optin">
I would like to see where this leads.
</label>

<br><br>

<button id="begin">Begin</button>
`;

document.getElementById("begin").onclick = startSurvey;
}

function startSurvey(){

session.participant_code =
document.getElementById("participant").value;

session.opt_in =
document.getElementById("optin").checked;

session.started = new Date().toISOString();

currentQuestion = 0;

showQuestion();
}

function showQuestion(){

const q = questions[currentQuestion];

questionStart = Date.now();

app.innerHTML = `
<div class="progress">
Question ${currentQuestion+1} of ${questions.length}
</div>

<div class="question">
${q.q}
</div>

<div id="answers"></div>

<div class="button-row">
<button id="back">Back</button>
<button id="next" disabled>Next</button>
</div>
`;

const answers = document.getElementById("answers");

let selected = null;

q.a.forEach((text,index)=>{

const letter = ["A","B","C","D"][index];

const div = document.createElement("label");

div.className="answer";

div.innerHTML=`
<input class="radio"
type="radio"
name="answer"
value="${letter}">
${letter}. ${text}
`;

answers.appendChild(div);

});

document.querySelectorAll('input[name="answer"]').forEach(r=>{

r.addEventListener("change",(e)=>{

selected = e.target.value;

document.getElementById("next").disabled=false;
});
});

document.getElementById("back").onclick = ()=>{

if(currentQuestion>0){
currentQuestion--;
showQuestion();
}
};

document.getElementById("next").onclick = ()=>{

const dwellSeconds =
Math.round((Date.now()-questionStart)/1000);

session.questions.push({
question:currentQuestion+1,
final_answer:selected,
dwell_seconds:dwellSeconds
});

currentQuestion++;

if(currentQuestion >= questions.length){
finish();
}else{
showQuestion();
}
};
}

function finish(){

session.completed = true;

session.ended = new Date().toISOString();

const data =
JSON.stringify(session,null,2);

app.innerHTML = `
<h1>Complete</h1>

<p>Thank you.</p>

<button id="download">
Download Results
</button>

<button id="copy">
Copy Results
</button>

<pre>${data}</pre>
`;

document.getElementById("copy").onclick=()=>{
navigator.clipboard.writeText(data);
};

document.getElementById("download").onclick=()=>{

const blob = new Blob(
[data],
{type:"application/json"}
);

const url =
URL.createObjectURL(blob);

const a =
document.createElement("a");

a.href=url;

a.download =
session.participant_code + "_results.json";

a.click();

URL.revokeObjectURL(url);
};
}

showIntro();

</script>

</body>
</html>
