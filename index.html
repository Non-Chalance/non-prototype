<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Re-Ward Prototype</title>

<style>
body{
    font-family: Arial, Helvetica, sans-serif;
    background:#fff;
    color:#000;
    margin:0;
    padding:20px;
}

.container{
    max-width:900px;
    margin:0 auto;
}

h1{
    font-size:2rem;
}

.question{
    font-size:1.6rem;
    margin-bottom:25px;
}

.answer{
    display:block;
    border:1px solid #000;
    padding:18px;
    margin-bottom:15px;
    cursor:pointer;
    font-size:1.2rem;
}

.answer:hover{
    background:#f3f3f3;
}

.radio{
    transform:scale(1.8);
    margin-right:12px;
}

.button-row{
    margin-top:20px;
}

button{
    font-size:1.1rem;
    padding:10px 20px;
    margin-right:10px;
}

.progress{
    margin-bottom:20px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<div id="app"></div>

</div>

<script>

const questions = [
{
q:"When nobody notices what you've done, are you more likely to...",
a:[
"Check it again",
"Carry on",
"Move to something else",
"Wish someone had noticed"
]
},
{
q:"Just before reaching a destination, are you usually...",
a:[
"Excited",
"Curious",
"Distracted",
"Nervous"
]
}
];

const session = {
participant_code:"",
opt_in:false,
started:null,
ended:null,
completed:false,
questions:[]
};

let currentQuestion = -1;
let questionStart = 0;

const app = document.getElementById("app");

function showIntro(){

app.innerHTML = `
<h1>Re-Ward Prototype</h1>

<p>
Thank you for participating in this experiment. The contribution of your answers and your time is invaluable to me.
</p>

<p>
Your responses will contribute to determining whether this concept is viable.
</p>

<p>
If you'd like to see where it leads, you can opt in at any time.
</p>

<p>
I am available through a variety of communication methods and welcome any questions, thoughts, observations, criticisms, concerns, or a belated opt-in 😉
</p>

<p>
Ex-O-Ex-O,<br><br>
Not Gossip Girl
</p>

<hr>

<label>
Participant Code:
<select id="participant">
<option>P11</option>
<option>P21</option>
<option>P31</option>
</select>
</label>

<br><br>

<label>
<input type="checkbox" id="optin">
I would like to see where this leads.
</label>

<br><br>

<button id="begin">Begin</button>
`;

document.getElementById("begin").onclick = startSurvey;
}

function startSurvey(){

session.participant_code =
document.getElementById("participant").value;

session.opt_in =
document.getElementById("optin").checked;

session.started = new Date().toISOString();

currentQuestion = 0;

showQuestion();
}

function showQuestion(){

const q = questions[currentQuestion];

questionStart = Date.now();

app.innerHTML = `
<div class="progress">
Question ${currentQuestion+1} of ${questions.length}
</div>

<div class="question">
${q.q}
</div>

<div id="answers"></div>

<div class="button-row">
<button id="back">Back</button>
<button id="next" disabled>Next</button>
</div>
`;

const answers = document.getElementById("answers");

let selected = null;

q.a.forEach((text,index)=>{

const letter = ["A","B","C","D"][index];

const div = document.createElement("label");

div.className="answer";

div.innerHTML=`
<input class="radio"
type="radio"
name="answer"
value="${letter}">
${letter}. ${text}
`;

answers.appendChild(div);

});

document.querySelectorAll('input[name="answer"]').forEach(r=>{

r.addEventListener("change",(e)=>{

selected = e.target.value;

document.getElementById("next").disabled=false;
});
});

document.getElementById("back").onclick = ()=>{

if(currentQuestion>0){
currentQuestion--;
showQuestion();
}
};

document.getElementById("next").onclick = ()=>{

const dwellSeconds =
Math.round((Date.now()-questionStart)/1000);

session.questions.push({
question:currentQuestion+1,
final_answer:selected,
dwell_seconds:dwellSeconds
});

currentQuestion++;

if(currentQuestion >= questions.length){
finish();
}else{
showQuestion();
}
};
}

function finish(){

session.completed = true;

session.ended = new Date().toISOString();

const data =
JSON.stringify(session,null,2);

app.innerHTML = `
<h1>Complete</h1>

<p>Thank you.</p>

<button id="download">
Download Results
</button>

<button id="copy">
Copy Results
</button>

<pre>${data}</pre>
`;

document.getElementById("copy").onclick=()=>{
navigator.clipboard.writeText(data);
};

document.getElementById("download").onclick=()=>{

const blob = new Blob(
[data],
{type:"application/json"}
);

const url =
URL.createObjectURL(blob);

const a =
document.createElement("a");

a.href=url;

a.download =
session.participant_code + "_results.json";

a.click();

URL.revokeObjectURL(url);
};
}

showIntro();

</script>

</body>
</html>
